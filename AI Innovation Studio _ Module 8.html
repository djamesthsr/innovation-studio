<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Innovation Studio | Module 8</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F1F3F7; --grid:rgba(43,68,224,.07); --surface:#FFFFFF; --surface-2:#E8ECF4;
  --ink:#18203A; --muted:#566079; --line:#CDD3E1;
  --cobalt:#2B44E0; --cobalt-ink:#FFFFFF; --cobalt-soft:#E0E5FF;
  --marker:#FFE14D; --marker-ink:#18203A;
  --mint:#127A58; --mint-soft:#D4F2E6; --warn:#A4291B; --warn-soft:#FBE2DC;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#10152A; --grid:rgba(138,152,255,.07); --surface:#182040; --surface-2:#232C50;
    --ink:#E8EBF6; --muted:#A5ACC6; --line:#323D68;
    --cobalt:#8F9CFF; --cobalt-ink:#10152A; --cobalt-soft:#28336B;
    --mint:#56D9A9; --mint-soft:#15403A; --warn:#FF9483; --warn-soft:#4A221C;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10152A; --grid:rgba(138,152,255,.07); --surface:#182040; --surface-2:#232C50;
  --ink:#E8EBF6; --muted:#A5ACC6; --line:#323D68;
  --cobalt:#8F9CFF; --cobalt-ink:#10152A; --cobalt-soft:#28336B;
  --mint:#56D9A9; --mint-soft:#15403A; --warn:#FF9483; --warn-soft:#4A221C;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
  font-family:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:17px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.disp{font-family:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;line-height:1.1;margin:0;letter-spacing:-.01em}
h2{font-size:clamp(1.6rem,3.6vw,2.3rem);font-weight:750}
h3{font-size:1.25rem;font-weight:700}
p{margin:.4rem 0}
img{max-width:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 1.25rem}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);background:color-mix(in srgb,var(--paper) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1.5px solid var(--ink)}
.topbar .wrap{display:flex;align-items:center;gap:1rem;min-height:60px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.6rem;font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:800;font-size:1.1rem;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--cobalt);color:var(--cobalt-ink);display:grid;place-items:center;font-size:.85rem;font-weight:800}
.brand small{font-family:'Atkinson Hyperlegible',sans-serif;font-weight:400;color:var(--muted);font-size:.85rem}
.nav{display:flex;gap:.25rem;overflow-x:auto;flex:1;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:.45rem .8rem;border-radius:999px;cursor:pointer;white-space:nowrap;font-weight:700;color:var(--muted)}
.nav button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.nav button:hover{color:var(--ink)}
.nav button[aria-current="page"]:hover{color:var(--paper)}
.tb-right{display:flex;align-items:center;gap:.8rem}
.ring{--p:0;width:40px;height:40px;border-radius:50%;background:conic-gradient(var(--cobalt) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.ring span{width:30px;height:30px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:.72rem;font-weight:700}
.switch{display:flex;align-items:center;gap:.45rem;cursor:pointer;font-size:.9rem;font-weight:700;white-space:nowrap}
.switch input{appearance:none;-webkit-appearance:none;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch input:checked{background:var(--cobalt)}
.switch input:checked::after{transform:translateX(16px)}
@media (max-width:760px){
  .topbar .wrap{gap:.4rem;padding-top:.4rem;padding-bottom:.4rem}
  .brand small{display:none}
  .nav{order:3;flex-basis:100%}
  .tb-right{margin-left:auto}
}

/* Session clock (teacher) */
.clock{display:none;border-bottom:1px dashed var(--cobalt);background:var(--cobalt-soft)}
body.teacher .clock{display:block}
.clock .wrap{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding-top:.55rem;padding-bottom:.55rem;font-size:.92rem}
.clock-time{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.clock-bar{flex:1;min-width:180px;height:10px;border-radius:999px;background:var(--surface);position:relative;overflow:hidden}
.clock-bar i{position:absolute;inset:0 auto 0 0;background:var(--cobalt);border-radius:999px}
.clock-bar b{position:absolute;top:0;bottom:0;width:2px;background:var(--paper)}

/* Buttons, inputs */
.btn{display:inline-flex;align-items:center;gap:.4rem;font-weight:700;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:.5rem 1.05rem;cursor:pointer;line-height:1.2;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:.32rem .75rem;font-size:.88rem}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.xbtn{border:0;background:none;color:var(--muted);cursor:pointer;width:30px;height:30px;border-radius:6px;font-size:1.1rem;flex:none}
.xbtn:hover{background:var(--warn-soft);color:var(--warn)}
input[type=text],input[type=url],input[type=number],textarea,select{
  font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:6px;padding:.55rem .7rem;width:100%;
}
textarea{resize:vertical;min-height:2.8rem;line-height:1.45}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 3px var(--cobalt-soft)}
::placeholder{color:var(--muted);opacity:.75}
label.f{display:block;margin-top:.9rem}
label.f > span{display:block;font-weight:700;font-size:.93rem;margin-bottom:.3rem}
label.f > span em{font-weight:400;font-style:normal;color:var(--muted)}
.row{display:flex;gap:.6rem;align-items:flex-end;flex-wrap:wrap}
.row > *{flex:1;min-width:150px}
.row > .btn{flex:none}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 1.25rem}
.check{display:flex;gap:.65rem;align-items:flex-start;padding:.55rem .2rem;border-bottom:1px solid var(--line);cursor:pointer}
.check:last-child{border-bottom:0}
.check input{width:20px;height:20px;accent-color:var(--cobalt);margin:.15rem 0 0;flex:none}
.check input:checked + span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--mint)}

/* Hero */
.hero{padding:2.6rem 0 1.4rem}
.hero-kicker{color:var(--muted);font-weight:700;margin-bottom:.8rem}
.hero h1{font-size:clamp(2.7rem,8.4vw,6rem);font-weight:800;letter-spacing:-.035em;line-height:.95}
.hero h1 span{display:block}
.hero h1 span:nth-child(2){padding-left:.55em}
.hero h1 span:nth-child(3){padding-left:1.1em;color:var(--cobalt)}
.hero-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:2rem;align-items:end}
.target{border-left:4px solid var(--marker);padding:.2rem 0 .2rem 1rem;font-size:1.12rem;max-width:44ch}
.target b{display:block;font-size:.9rem;color:var(--muted);margin-bottom:.25rem}
.hero-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1.1rem}
details.criteria{margin-top:1rem;max-width:60ch}
details.criteria summary{cursor:pointer;font-weight:700;color:var(--cobalt)}
details.criteria ol{margin:.6rem 0 0;padding-left:1.4rem}
details.criteria li{margin:.2rem 0}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}}

/* Journey track */
.journey{margin:2rem 0 .5rem;position:relative}
.j-track{position:relative;height:6px;border-radius:999px;background:var(--surface-2);margin:0 calc(100%/12)}
.j-fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--cobalt);border-radius:999px;transition:width 1.1s cubic-bezier(.2,.7,.2,1)}
.j-nodes{display:grid;grid-template-columns:repeat(6,1fr);margin-top:-21px;position:relative}
.j-node{display:flex;flex-direction:column;align-items:center;gap:.4rem;text-align:center}
.j-dot{width:36px;height:36px;border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-weight:800;font-size:.85rem;font-family:'Bricolage Grotesque',sans-serif;position:relative;transition:background .3s,color .3s}
.j-dot svg{position:absolute;inset:-6px;width:44px;height:44px;transform:rotate(-90deg)}
.j-node.done .j-dot{background:var(--cobalt);border-color:var(--cobalt);color:var(--cobalt-ink)}
.j-label{font-weight:700;font-size:.95rem}
.j-sub{font-size:.78rem;color:var(--muted);max-width:14ch;line-height:1.3}
@media (max-width:560px){.j-sub{display:none}.j-label{font-size:.8rem}.j-dot{width:30px;height:30px}.j-nodes{margin-top:-18px}}

/* Segment rail */
.rail{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:.5rem;margin:1.8rem 0 0}
.rail button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:.65rem .7rem .7rem;cursor:pointer;display:flex;flex-direction:column;gap:.15rem;min-height:118px;position:relative}
.rail button:hover{border-color:var(--ink)}
.rail .n{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.5rem;line-height:1;color:var(--cobalt)}
.rail .t{font-weight:700;font-size:.9rem;line-height:1.25}
.rail .tm{font-size:.78rem;color:var(--muted);margin-top:auto}
.rail .bar{height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.rail .bar i{display:block;height:100%;background:var(--mint);width:0}
.rail button[aria-current="step"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rail button[aria-current="step"] .n{color:var(--marker)}
.rail button[aria-current="step"] .tm{color:var(--paper);opacity:.75}
.rail .ok{position:absolute;top:.55rem;right:.6rem;width:20px;height:20px;border-radius:50%;background:var(--mint);color:var(--paper);display:none;place-items:center;font-size:.75rem;font-weight:800}
.rail button.complete .ok{display:grid}
@media (max-width:980px){.rail{display:flex;overflow-x:auto;padding-bottom:.4rem;scroll-snap-type:x mandatory}.rail button{min-width:150px;scroll-snap-align:start}}

/* Segment panel */
.panel{margin:1.5rem 0 3rem}
.seg-head{display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:start;padding:1.4rem 0 .4rem;border-top:1.5px solid var(--ink)}
.seg-num{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(3.6rem,9vw,6rem);line-height:.82;color:transparent;-webkit-text-stroke:2px var(--cobalt)}
.seg-meta{display:flex;gap:.5rem;flex-wrap:wrap;margin:.5rem 0 .4rem}
.tag{display:inline-block;font-size:.82rem;font-weight:700;border-radius:999px;padding:.18rem .65rem;background:var(--surface-2)}
.tag.time{background:var(--marker);color:var(--marker-ink)}
.objective{max-width:62ch;font-size:1.08rem}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.2rem 1.35rem;margin-top:1.2rem}
.block > h3 + p.hint{margin-top:.25rem}
.hint{color:var(--muted);font-size:.95rem;max-width:70ch}
.quote{margin:.7rem 0 0;font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:600;line-height:1.3;max-width:52ch}
.takeaway{margin-top:1.6rem;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:clamp(1.1rem,2.3vw,1.4rem);line-height:1.5;max-width:46ch}
.mark{background:var(--marker);color:var(--marker-ink);padding:.06em .3em;-webkit-box-decoration-break:clone;box-decoration-break:clone;border-radius:3px}
.teacher-note{display:none;margin-top:1.1rem;border:1.5px dashed var(--cobalt);background:var(--cobalt-soft);border-radius:10px;padding:.9rem 1.1rem;font-size:.95rem}
body.teacher .teacher-note{display:block}
.teacher-note h4{font-size:1rem;margin-bottom:.3rem}
.teacher-note ul{margin:.3rem 0 0;padding-left:1.2rem}

/* Deliverable sheet: folder-tab worksheet */
.sheet{position:relative;background:var(--surface);border:1.5px solid var(--ink);border-radius:0 10px 10px 10px;padding:1.2rem 1.35rem 1.4rem;margin-top:3rem}
.sheet-tab{position:absolute;bottom:100%;left:-1.5px;background:var(--ink);color:var(--paper);padding:.38rem 1rem .32rem;border-radius:8px 8px 0 0;font-weight:700;font-size:.9rem;white-space:nowrap;max-width:calc(100% + 3px);overflow:hidden;text-overflow:ellipsis}
.sheet-tab small{font-weight:400;opacity:.75;margin-left:.4rem}

/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:.8rem}
.chip{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;padding:.38rem .85rem;cursor:pointer;font-weight:700;font-size:.92rem}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--marker);border-color:var(--marker);color:var(--marker-ink)}
.spark{margin-top:1rem;padding:.9rem 1rem;border-radius:8px;background:var(--surface-2);font-size:1.08rem;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.spark strong{font-family:'Bricolage Grotesque',sans-serif}

/* Example products */
.ex-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:.6rem;margin-top:.9rem}
.ex{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:.8rem .9rem;cursor:pointer;display:flex;flex-direction:column;gap:.2rem}
.ex:hover{border-color:var(--ink)}
.ex[aria-pressed="true"]{border-color:var(--cobalt);box-shadow:inset 0 0 0 1.5px var(--cobalt)}
.ex-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:750;font-size:1.1rem}
.ex-line{font-size:.9rem;color:var(--muted)}
.breakdown{display:grid;grid-template-columns:minmax(150px,auto) 1fr;gap:.5rem 1.2rem;margin:1rem 0 0;padding:1rem 0 0;border-top:1px solid var(--line)}
.breakdown dt{font-weight:700}
.breakdown dd{margin:0}
@media (max-width:600px){.breakdown{grid-template-columns:1fr;gap:.1rem}.breakdown dd{margin-bottom:.6rem}}
.empty-note{margin-top:1rem;color:var(--muted);font-style:italic}

/* Problem statement */
.statement{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(1.25rem,2.8vw,1.75rem);font-weight:600;line-height:1.45;margin:1.1rem 0 .4rem;max-width:40ch}
.slot{border-bottom:3px solid var(--cobalt);padding:0 .1em}
.slot.empty{color:var(--muted);border-bottom-style:dashed;font-weight:500}

/* Persona */
.persona-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:1.4rem;align-items:start}
@media (max-width:820px){.persona-grid{grid-template-columns:1fr}}
.persona{border-radius:10px;background:var(--surface-2);padding:1.1rem 1.2rem;position:sticky;top:110px}
.persona-top{display:flex;gap:.8rem;align-items:center;margin-bottom:.6rem}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--cobalt);color:var(--cobalt-ink);display:grid;place-items:center;font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.4rem;flex:none}
.persona-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:750;font-size:1.3rem}
.persona dl{margin:0}
.persona dt{font-size:.82rem;font-weight:700;color:var(--muted);margin-top:.55rem}
.persona dd{margin:0}
.persona .empty{color:var(--muted);font-style:italic}

/* Journey map */
.jmap{display:flex;gap:.4rem;overflow-x:auto;padding:.6rem 0 .2rem;margin-top:.8rem}
.jstep{min-width:132px;flex:1;display:flex;flex-direction:column;border-radius:8px;background:var(--paper);border:1px solid var(--line);padding:.5rem}
.jlanes{display:grid;grid-template-rows:repeat(3,26px);position:relative;border-bottom:1px dashed var(--line);margin-bottom:.4rem}
.jlanes span{grid-column:1;justify-self:center;font-size:1.25rem;line-height:26px}
.jstep p{font-size:.9rem;margin:0 0 .4rem;flex:1}
.jmood{display:flex;gap:.2rem;align-items:center}
.jmood button{border:1px solid var(--line);background:var(--surface);border-radius:6px;cursor:pointer;width:30px;height:28px;font-size:.95rem;padding:0}
.jmood button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}
.mood-pick{display:flex;gap:.3rem}
.mood-pick button{border:1.5px solid var(--line);background:var(--paper);border-radius:8px;padding:.45rem .6rem;cursor:pointer;font-size:.88rem;font-weight:700}
.mood-pick button[aria-pressed="true"]{border-color:var(--cobalt);background:var(--cobalt-soft)}

/* Idea scoring */
.scroll-x{overflow-x:auto;margin-top:.8rem}
table{border-collapse:collapse;width:100%}
.score-table th,.score-table td{padding:.55rem .5rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.score-table th{font-size:.82rem;line-height:1.25}
.score-table th small{display:block;font-weight:400;color:var(--muted);max-width:14ch}
.score-table td.idea{font-weight:700;min-width:160px}
.pips{display:flex;gap:3px}
.pip{width:20px;height:20px;border-radius:4px;border:1.5px solid var(--line);background:var(--paper);cursor:pointer;padding:0}
.pip.on{background:var(--cobalt);border-color:var(--cobalt)}
.pip:hover{border-color:var(--cobalt)}
.total{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.2rem;white-space:nowrap}
.ranking{margin-top:1.1rem;display:grid;gap:.45rem}
.rank{display:grid;grid-template-columns:1.6rem 1fr auto;gap:.6rem;align-items:center}
.rank .rb{height:26px;border-radius:6px;background:var(--surface-2);position:relative;overflow:hidden}
.rank .rb i{position:absolute;inset:0 auto 0 0;background:var(--cobalt-soft);border-right:3px solid var(--cobalt)}
.rank .rb span{position:relative;padding:0 .6rem;line-height:26px;font-size:.92rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chosen-badge{display:inline-block;background:var(--mint-soft);color:var(--mint);font-weight:700;font-size:.8rem;padding:.1rem .5rem;border-radius:999px;margin-left:.4rem}

/* MVP sorter */
.sorter{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem}
@media (max-width:640px){.sorter{grid-template-columns:1fr}}
.bucket{border-radius:10px;padding:.8rem;min-height:120px}
.bucket.must{background:var(--cobalt-soft)}
.bucket.nice{background:var(--surface-2)}
.bucket h4{font-size:1.05rem;margin-bottom:.15rem}
.bucket > p{font-size:.85rem;color:var(--muted);margin:0 0 .5rem}
.feat{display:flex;align-items:center;gap:.3rem;background:var(--surface);border-radius:7px;padding:.35rem .35rem .35rem .7rem;margin-top:.35rem;border:1px solid var(--line)}
.feat span{flex:1;font-size:.95rem}
.warn{margin-top:.8rem;padding:.6rem .8rem;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:700;font-size:.93rem}
.flow{display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;margin-top:.8rem}
.flow-step{display:flex;align-items:center;gap:.25rem;background:var(--paper);border:1.5px solid var(--ink);border-radius:8px;padding:.35rem .3rem .35rem .65rem;font-weight:700;font-size:.93rem}

.flow-arrow{color:var(--muted);font-weight:800}
.aiflow{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:.6rem;align-items:stretch;margin-top:.9rem}
.aiflow .arr{align-self:center;font-size:1.4rem;color:var(--cobalt);font-weight:800}
.aibox{border-radius:10px;padding:.8rem;background:var(--paper);border:1.5px solid var(--line)}
.aibox.mid{border-color:var(--cobalt);background:var(--cobalt-soft)}
.aibox h4{font-size:1rem;margin-bottom:.4rem}

/* Product types */
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin-top:.8rem}
.type{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:.7rem .8rem;cursor:pointer;text-align:left;font-weight:700}
.type small{display:block;font-weight:400;color:var(--muted);font-size:.83rem;margin-top:.15rem}
.type:hover{border-color:var(--ink)}
.type[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.type[aria-pressed="true"] small{color:var(--paper);opacity:.75}
.toolset{margin-top:1rem;padding:.9rem 1rem;border-radius:8px;background:var(--surface-2)}
.toolset .chips{margin-top:.5rem}
.toolset .chip{cursor:default;background:var(--surface)}

/* Logs / feedback */
.log{margin-top:.8rem;display:grid;gap:.5rem}
.log-item{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:.6rem;align-items:start;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem;font-size:.95rem}
.log-item b{display:block;font-size:.78rem;color:var(--muted)}

.fpi{display:grid;grid-template-columns:1fr auto 1fr auto 1fr auto;gap:.5rem;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:.6rem .7rem}
.fpi .arr{color:var(--cobalt);font-weight:800}
.fpi div b{display:block;font-size:.78rem;color:var(--muted)}
.imp{font-size:.75rem;font-weight:800;padding:.1rem .5rem;border-radius:999px;margin-top:.2rem;display:inline-block}
.imp.High{background:var(--warn-soft);color:var(--warn)}
.imp.Medium{background:var(--marker);color:var(--marker-ink)}
.imp.Low{background:var(--surface-2)}
@media (max-width:760px){.fpi{grid-template-columns:1fr}.fpi .arr{transform:rotate(90deg);justify-self:start}}
.example{font-size:.93rem;padding:.6rem .8rem;border-left:3px solid var(--marker);background:var(--paper);margin-top:.7rem;border-radius:0 6px 6px 0}
.qlist{margin:.6rem 0 0;padding-left:1.3rem}
.qlist li{margin:.25rem 0}
.counts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}

.pitch-list{display:grid;gap:.2rem;counter-reset:p}

.pitch-item h4{font-size:1.05rem}
.pitch-item p{font-size:.88rem;color:var(--muted);margin:.1rem 0 .4rem}

.pm-a{font-size:clamp(1.2rem,2.8vw,1.8rem);line-height:1.45;margin-top:1.2rem;max-width:44ch;white-space:pre-wrap}

.ext-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.5rem;margin-top:.9rem}

.seg-foot{display:flex;justify-content:space-between;gap:1rem;margin-top:1.8rem;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.2rem);transform:translate(-50%,150%);background:var(--ink);color:var(--paper);padding:.65rem 1.1rem;border-radius:999px;font-weight:700;z-index:120;transition:transform .25s}

footer{border-top:1.5px solid var(--ink);padding:1.2rem 0 2rem;font-size:.9rem;color:var(--muted)}

@media print{

  case 2:{const s=S.s2;return ratio([s.who,s.what,s.why,...CHALLENGE_Q.map((_,i)=>s.q['q'+i])].filter(F).length,9);}
  case 3:{const p=S.s3.p;return ratio(PFIELDS.filter(f=>F(p[f.k])).length+Math.min(S.s3.journey.length,3),PFIELDS.length+3);}
  case 4:{const s=S.s4;return ratio(Math.min(s.ideas.length,2)+(s.chosen!=null?1:0)+CFIELDS.filter(f=>F(s.c[f.k])).length,3+CFIELDS.length);}
  case 5:{const s=S.s5,m=s.features.filter(f=>f.must).length,nh=s.features.length-m;return ratio((m?1:0)+(nh?1:0)+Math.min(s.flow.length,3)+['input','process','output'].filter(k=>F(s.ai[k])).length+(F(s.oneday)?1:0),9);}
  case 6:{const s=S.s6;return ratio((s.type!=null?1:0)+BUILD.filter((_,i)=>s.check[i]).length+(s.log.length?1:0),2+BUILD.length);}
  case 7:{return ratio(S.s7.rows.length,3);}
  case 8:{const s=S.s8;return ratio(REFINE.filter((_,i)=>s.steps[i]).length+PITCH.filter(p=>F(s.pitch[p.k])).length+DELIV.filter((_,i)=>s.del[i]).length+(F(s.reflection)?1:0),REFINE.length+PITCH.length+DELIV.length+1);}
 }return 0;
}
function stageComp(){
 const s8=S.s8;
 return[(comp(2)+comp(3))/2,(comp(4)+comp(5))/2,comp(6),comp(7),
  ratio(REFINE.filter((_,i)=>s8.steps[i]).length+(S.s7.rows.some(r=>r.sel)?1:0),REFINE.length+1),
  ratio(PITCH.filter(p=>F(s8.pitch[p.k])).length,PITCH.length)];
}

function tick(){
 const c=S.clock;const ms=c.acc+(c.start?Date.now()-c.start:0);const min=Math.min(300,ms/60000);
 $('#clockTime').textContent=Math.floor(min)+' min '+pad(Math.floor((ms/1000)%60))+' s';
 const bar=$('#clockBar');bar.querySelector('i').style.width=(min/300*100)+'%';
 if(!bar.querySelector('b'))SEGMENTS.slice(1).forEach(s=>{const b=document.createElement('b');b.style.left=(s.t[0]/300*100)+'%';bar.appendChild(b);});
 const cur=SEGMENTS.find(s=>min>=s.t[0]&&min<s.t[1])||SEGMENTS[7];
 $('#clockNow').innerHTML=`Now: <button class="btn small ghost" data-act="go-seg" data-n="${cur.n}" style="color:var(--cobalt)">${cur.n}. ${cur.title}</button>`;
 $('#clockBtn').textContent=c.start?'Pause':(ms>0?'Resume':'Start session');
}
setInterval(()=>{if(S.teacher&&S.clock.start)tick();},1000);

/* ---------- Events ---------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.tagName==='INPUT')return;const fn=ACT[b.dataset.act];if(fn){e.preventDefault();fn(b.dataset);}});
document.addEventListener('input',e=>{
 const t=e.target;
 if(t.dataset&&t.dataset.k){setP(t.dataset.k,t.type==='checkbox'?t.checked:t.value);save();refresh();}
 if(t.id==='toolSearch'){const q=t.value.toLowerCase().trim();let shown=0;document.querySelectorAll('#toolTable tbody tr').forEach(r=>{const m=!q||r.textContent.toLowerCase().includes(q);r.hidden=!m;if(m)shown++;});$('#toolEmpty').hidden=shown>0;}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.k&&(t.type==='checkbox'||t.tagName==='SELECT')){setP(t.dataset.k,t.type==='checkbox'?t.checked:t.value);save();refresh();}});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();const fn=ACT[e.target.dataset.enter];if(fn)fn(e.target.dataset.enter==='add-feat'?{must:'1'}:{});}
 if($('#pitchMode').classList.contains('open')){if(e.key==='ArrowRight')ACT['pm-next']();if(e.key==='ArrowLeft')ACT['pm-prev']();if(e.key==='Escape')ACT['pitch-close']();}
});
const tg=$('#teacherToggle');
tg.addEventListener('change',()=>{S.teacher=tg.checked;document.body.classList.toggle('teacher',S.teacher);save();tick();});

/* ---------- Init ---------- */
tg.checked=!!S.teacher;document.body.classList.toggle('teacher',!!S.teacher);
render();tick();
</script>
</body>
</html>
